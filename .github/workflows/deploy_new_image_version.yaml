name: Deploy new image version

on:
  workflow_dispatch:

permissions:
  packages: write

env:
  TAG: ${{ github.run_number }}
  GKE_CLUSTER: services-prod-1
  GKE_ZONE: europe-west2-b

jobs:
  build-image-and-push:
    name: Build image and push to ghcr.io

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set lower case repository name
        id: prepare-outputs

        run: |
          echo "IMAGE_REPOSITORY_LOWERCASE=$(printf ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build&Push App container image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY_LOWERCASE }}:${{ env.TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_REPOSITORY_LOWERCASE }}:build-cache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_REPOSITORY_LOWERCASE }}:build-cache
  update-gitops:
    name: Update GitOps Values
    runs-on: ubuntu-latest
    needs: [build-image-and-push]

    steps:
      - name: Get Executor token
        id: executor
        uses: getsentry/action-github-app-token@v4.0.0
        with:
          app_id: ${{ secrets.ACTION_EXECUTOR_ID }}
          private_key: ${{ secrets.ACTION_EXECUTOR_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: KaveTech/kutt-gitops
          token: ${{ steps.executor.outputs.token}}

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update backend and migrator image tags
        run: |
          yq -i '.kutt.image.tag = "${{ env.TAG }}"' values.yaml

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ steps.executor.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git fetch origin main
          git add -- values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "ci: set image tag to ${{ env.TAG }}"
          git push origin HEAD:refs/heads/main
